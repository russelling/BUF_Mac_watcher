[project]
name = "shotgrid-resolve-bridge"
version = "0.1.0"
description = "Push ShotGrid Playlists into DaVinci Resolve with a per-shot ACES / CDL / Show LUT color pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "shotgun-api3>=3.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
push-playlist-to-resolve = "resolve_bridge.push_playlist_to_resolve:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["resolve_bridge*"]
exclude = ["resolve_bridge.tests*"]
