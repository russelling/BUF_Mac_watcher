<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    "Observation" — department mark for the QT Watcher monitor.

    Front elevation of a pair of binoculars, drawn as a schematic: a narrow
    eyepiece tube over a drum objective, twice, fused by a bridge with a
    knurled focus wheel. Perfect circles, bilateral symmetry, no gradients,
    no bevels. One pale institutional field, one ink, one muted accent.
    Everything outside the field disc is transparent.

    Palette is drop_app/theme.py, so the icon and the panel agree.
      field  #E6E7EA   PALE_GRAY
      ink    #1A2330   NAVY
      accent #4A5C40   OLIVE  /  #8B9A7C  SAGE
  -->
  <g id="field">
    <circle cx="512" cy="512" r="474" fill="#E6E7EA"/>
    <circle cx="512" cy="512" r="442" fill="none" stroke="#1A2330"
            stroke-opacity="0.32" stroke-width="6"/>
    <g stroke="#1A2330" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round">
      <path d="M512 74  L512 106"/>
      <path d="M512 918 L512 950"/>
      <path d="M74 512  L106 512"/>
      <path d="M918 512 L950 512"/>
    </g>
  </g>

  <g id="mark" transform="translate(512 512) scale(1.12) translate(-512 -504)">
    <g fill="#1A2330">
      <!-- bridge -->
      <rect x="400" y="466" width="224" height="152" rx="26"/>
      <!-- eyepiece tubes -->
      <rect x="271" y="320" width="150" height="240" rx="75"/>
      <rect x="603" y="320" width="150" height="240" rx="75"/>
      <!-- objective drums -->
      <circle cx="346" cy="556" r="132"/>
      <circle cx="678" cy="556" r="132"/>
    </g>

    <!-- objectives -->
    <g fill="#E6E7EA">
      <circle cx="346" cy="556" r="97"/>
      <circle cx="678" cy="556" r="97"/>
    </g>
    <g fill="#4A5C40">
      <circle cx="346" cy="556" r="66"/>
      <circle cx="678" cy="556" r="66"/>
    </g>
    <!-- lens element ring, not a cartoon glint -->
    <g fill="none" stroke="#8B9A7C" stroke-width="8" opacity="0.9">
      <circle cx="346" cy="556" r="42"/>
      <circle cx="678" cy="556" r="42"/>
    </g>

    <!-- focus wheel, knurled, exactly filling the gap between the drums -->
    <rect x="478" y="486" width="68" height="112" rx="22" fill="#E6E7EA"/>
    <g stroke="#1A2330" stroke-width="9" stroke-linecap="round" opacity="0.85">
      <path d="M496 508 L496 576"/>
      <path d="M512 502 L512 582"/>
      <path d="M528 508 L528 576"/>
    </g>
  </g>
</svg>
