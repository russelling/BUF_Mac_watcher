<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    "Optics & Observation" — department mark for the QT Watcher monitor.

    Flat retro-corporate idiom: one pale institutional field, one ink, one
    muted accent. Bilateral symmetry, solid silhouette, no gradients, no
    bevels. Everything outside the field disc is transparent.

    Palette is drop_app/theme.py, so the icon and the panel agree.
      field  #E6E7EA   PALE_GRAY
      ink    #1A2330   NAVY
      accent #4A5C40   OLIVE  /  #8B9A7C  SAGE
  -->
  <g id="field">
    <circle cx="512" cy="512" r="474" fill="#E6E7EA"/>
    <circle cx="512" cy="512" r="442" fill="none" stroke="#1A2330"
            stroke-opacity="0.32" stroke-width="6"/>
    <g stroke="#1A2330" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round">
      <path d="M512 74  L512 106"/>
      <path d="M512 918 L512 950"/>
      <path d="M74 512  L106 512"/>
      <path d="M918 512 L950 512"/>
    </g>
  </g>

  <g id="mark" transform="translate(512 512) scale(1.11) translate(-512 -525)">
    <!-- horns: short, thick at the boss, blunt tips turned up -->
    <g fill="#1A2330">
      <path d="M322 500 C 252 496 194 518 160 444
               C 184 506 248 542 330 556 Z"/>
      <path d="M702 500 C 772 496 830 518 864 444
               C 840 506 776 542 694 556 Z"/>
    </g>

    <!-- head -->
    <path d="M282 556 A 230 230 0 0 1 742 556
             L 742 600
             C 742 678 644 732 512 732
             C 380 732 282 678 282 600 Z"
          fill="#1A2330"/>

    <!-- crown parting -->
    <path d="M404 398 C 446 376 578 376 620 398" fill="none"
          stroke="#E6E7EA" stroke-width="14" stroke-linecap="round"/>

    <!-- binoculars, cut out of the silhouette -->
    <g fill="#E6E7EA">
      <circle cx="406" cy="518" r="98"/>
      <circle cx="618" cy="518" r="98"/>
      <rect x="486" y="492" width="52" height="52" rx="15"/>
    </g>
    <circle cx="406" cy="518" r="63" fill="#4A5C40"/>
    <circle cx="618" cy="518" r="63" fill="#4A5C40"/>
    <circle cx="386" cy="498" r="18" fill="#8B9A7C"/>
    <circle cx="598" cy="498" r="18" fill="#8B9A7C"/>

    <!-- muzzle -->
    <rect x="428" y="626" width="168" height="96" rx="46" fill="#E6E7EA"/>
    <g fill="#1A2330">
      <rect x="474" y="650" width="15" height="30" rx="7"/>
      <rect x="535" y="650" width="15" height="30" rx="7"/>
    </g>
    <path d="M478 696 C 494 710 530 710 546 696" fill="none"
          stroke="#1A2330" stroke-width="13" stroke-linecap="round"/>
  </g>
</svg>
